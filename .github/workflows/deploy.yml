name: Deploy to Yandex Object Storage

on:
  push:
    branches:
      - temp
  workflow_dispatch:

concurrency:
  group: deploy-object-storage
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload site
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ vars.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          BUCKET: temp-studio
        run: |
          set -euo pipefail

          aws s3 sync . "s3://${BUCKET}" \
            --endpoint-url https://storage.yandexcloud.net \
            --acl public-read \
            --delete \
            --cache-control "public, max-age=3600" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude "tools/*" \
            --exclude "api/*" \
            --exclude ".DS_Store" \
            --no-progress

          aws s3 cp . "s3://${BUCKET}" \
            --endpoint-url https://storage.yandexcloud.net \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --acl public-read \
            --cache-control "no-cache" \
            --content-type "text/html; charset=utf-8" \
            --no-progress

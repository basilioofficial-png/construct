<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PINHEAD — конструктор печати на одежде</title>
  <meta name="description" content="Создайте свой дизайн: выберите изделие, цвет, загрузите картинку и оформите заказ печати.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="./">PINHEAD</a>
    <span class="topbar__hint">Конструктор печати</span>
  </header>

  <main class="layout">
    <!-- ЛЕВАЯ ЧАСТЬ: превью изделия -->
    <section class="preview" aria-label="Превью изделия">
      <div class="preview__stage" id="stage">
        <svg id="mockup" viewBox="0 0 400 460" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Макет изделия">
          <defs>
            <clipPath id="printClip"><rect id="printClipRect"/></clipPath>
            <mask id="designMask" style="mask-type: alpha"><image id="designMaskImg" preserveAspectRatio="xMidYMid meet"/></mask>
          </defs>
          <image id="garmentImg" x="0" y="0" width="400" height="460" preserveAspectRatio="xMidYMid meet"/>
          <g clip-path="url(#printClip)">
            <image id="designImg" preserveAspectRatio="xMidYMid meet" visibility="hidden"/>
            <!-- складки ткани поверх принта: так картинка выглядит напечатанной -->
            <image id="printShade" x="0" y="0" width="400" height="460" mask="url(#designMask)" style="mix-blend-mode: multiply" pointer-events="none" visibility="hidden"/>
          </g>
          <rect id="printArea" class="print-area" rx="4"/>
        </svg>
        <div class="preview__empty" id="previewEmpty">Выберите изделие, чтобы начать</div>
      </div>
      <div class="preview__caption" id="previewCaption"></div>
    </section>

    <!-- ПРАВАЯ ЧАСТЬ: шаги -->
    <section class="panel" aria-label="Шаги оформления">
      <ol class="stepper" id="stepper"></ol>

      <div class="panel__body" id="stepBody"></div>

      <footer class="panel__footer">
        <div class="price">
          <span class="price__label">Итого</span>
          <span class="price__value" id="totalPrice">—</span>
        </div>
        <div class="nav">
          <button class="btn btn--ghost" id="btnBack" type="button">Назад</button>
          <button class="btn btn--primary" id="btnNext" type="button">Далее</button>
        </div>
      </footer>
    </section>
  </main>

  <!-- Данные (база изделий и цветов) и логика приложения -->
  <script src="js/blanks.js"></script>
  <script src="js/data.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
